[package]
name = "rkp_extractor"
description = "Duck ToolBox backend trimmed to the device RKP issuer (rkp-device) for Jerry Manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "rkp_extractor"
path = "src/main.rs"

[features]
default = ["rkp-device"]
rkp-device = ["dep:duck-rkp-device"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
duck-core.workspace = true
duck-platform.workspace = true
duck-rkp-device = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
